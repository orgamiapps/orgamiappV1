plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def kotlin_version = '2.3.10'
def mapsAndroidApiKey = System.getenv('GOOGLE_MAPS_ANDROID_API_KEY') ?: ''
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('key.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def releaseStoreFile = System.getenv('ATTENDUS_ANDROID_STORE_FILE') ?:
    signingProperties.getProperty('storeFile', '')
def releaseStorePassword = System.getenv('ATTENDUS_ANDROID_STORE_PASSWORD') ?:
    signingProperties.getProperty('storePassword', '')
def releaseKeyAlias = System.getenv('ATTENDUS_ANDROID_KEY_ALIAS') ?:
    signingProperties.getProperty('keyAlias', '')
def releaseKeyPassword = System.getenv('ATTENDUS_ANDROID_KEY_PASSWORD') ?:
    signingProperties.getProperty('keyPassword', '')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword &&
    releaseKeyAlias && releaseKeyPassword

if (!mapsAndroidApiKey) {
    def localPropertiesFile = rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        def localProperties = new Properties()
        localPropertiesFile.withInputStream { localProperties.load(it) }
        mapsAndroidApiKey = localProperties.getProperty('GOOGLE_MAPS_ANDROID_API_KEY', '')
    }
}

def isReleaseBuild = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
if (isReleaseBuild && !mapsAndroidApiKey) {
    throw new GradleException(
        'GOOGLE_MAPS_ANDROID_API_KEY is required for Android release builds.'
    )
}
if (isReleaseBuild && !hasReleaseSigning) {
    throw new GradleException(
        'Android release signing is required. Configure key.properties or the ' +
        'ATTENDUS_ANDROID_STORE_* and ATTENDUS_ANDROID_KEY_* environment variables.'
    )
}

android {
    namespace = "com.stormdeve.orgami"
    compileSdk = 36
    // Use the highest NDK required by native plugins (currently `jni`).
    // Newer NDK releases remain backward-compatible with plugins that request
    // older versions.
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.stormdeve.orgami"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = project.findProperty('android.minSdkVersion')?.toInteger() ?: 24
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Preserve Flutter's `applicationName` placeholder while adding Maps.
        manifestPlaceholders["GOOGLE_MAPS_ANDROID_API_KEY"] = mapsAndroidApiKey
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = rootProject.file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            // Disable code shrinking to avoid R8 missing classes for Stripe push provisioning
            minifyEnabled false
            shrinkResources false
        }
    }

}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    // Facebook SDK - disabled due to flutter_facebook_auth plugin being unused
    // implementation 'com.facebook.android:facebook-android-sdk:17.0.2'
    // ONNX Runtime Mobile temporarily disabled due to missing model files
    // TODO: Re-enable after adding model files to assets/models/
    // implementation 'com.microsoft.onnxruntime:onnxruntime-mobile:1.16.3'
    // Coroutines for async operations
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}

flutter {
    source = "../.."
}
