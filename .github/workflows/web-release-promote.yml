name: Promote the exact qualified production web artifact
'on':
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Successful immutable 24-hour qualification workflow run ID
        required: true
      expected_prior_release:
        description: Exact prior Hosting version resource captured with the candidate
        required: true
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      QUALIFICATION_RUN: ${{ inputs.qualification_run }}
      EXPECTED_PRIOR_RELEASE: ${{ inputs.expected_prior_release }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: google-github-actions/setup-gcloud@v2
    - run: npm ci
      working-directory: functions
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.WIF_PROVIDER }}
        service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}
    - run: node tools/web_release_pipeline.js promote --qualification-run "$QUALIFICATION_RUN" --expected-prior-release
        "$EXPECTED_PRIOR_RELEASE" --output build/web-promotion
      name: Verify provenance and predecessor, then promote without rebuilding
    - uses: actions/upload-artifact@v4
      with:
        name: web-production-promotion
        path: 'build/web-promotion/production-deployment.json

          build/web-promotion/promotion-provenance.json

          build/web-promotion/hosting-asset-bridge.json

          build/web-promotion/*.txt'
        include-hidden-files: true
        retention-days: 90
        if-no-files-found: error
      if: always()
concurrency:
  group: attendus-web-production
  cancel-in-progress: false
