name: Attendus quality
'on':
  workflow_call: null
permissions:
  contents: read
env:
  FLUTTER_VERSION: 3.44.6
  NODE_VERSION: 22
jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    - run: flutter pub get --enforce-lockfile
    - name: Validate Firestore deployment verifier
      run: node --check tools/verify_firestore_indexes.js
    - name: Validate Firestore query contracts
      run: node --test tools/check_firestore_query_contracts.test.js tools/verify_firestore_indexes.test.js
    - run: node tools/check_firestore_query_contracts.js
    - name: Validate Discovery category contract
      run: node --test tools/check_discovery_category_catalog.test.js && node tools/check_discovery_category_catalog.js
    - name: Validate public web routing and asset budget
      run: node --test tools/check_public_web_contract.test.js && node tools/check_public_web_contract.js
    - name: Check formatting
      run: dart format --output=none --set-exit-if-changed lib test tools apps/attendus_admin/lib apps/attendus_admin/test
        apps/attendus_admin/integration_test integration_test test_driver
    - run: flutter analyze lib test tools integration_test test_driver
    - run: flutter test --exclude-tags=emulator
    - name: Analyze and test Attendus Admin
      working-directory: apps/attendus_admin
      run: 'flutter pub get --enforce-lockfile

        flutter analyze

        flutter test

        '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install PyYAML==6.0.3
    - name: Validate native configuration and release gates
      run: python -m unittest discover -s tools -p "test_*release*.py"
  web-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
    - run: flutter pub get --enforce-lockfile
    - name: Build production-shaped web bundle
      run: flutter build web --release --pwa-strategy=none --no-wasm-dry-run --dart-define=GOOGLE_MAPS_WEB_API_KEY=ci-placeholder-key
        --dart-define=ATTENDUS_RELEASE_ID=${{ github.sha }}
    - name: Configure and verify web environment isolation
      run: dart run tools/configure_web_environment.dart --environment production
    - name: Install retirement worker
      run: cp web/flutter_service_worker_retirement.js build/web/flutter_service_worker.js
    - name: Retain supported production releases
      run: dart run tools/retain_web_releases.dart https://attendus.app/
    - run: dart run tools/package_web_release.dart
    - run: dart run tools/check_deferred_web_chunks.dart
    - run: dart run tools/check_web_bundle_size.dart
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
        cache-dependency-path: functions/package-lock.json
    - run: npm ci
    - run: npm run lint
    - run: npm test
    - run: node ../tools/check_firestore_query_contracts.js
    - run: node --test ../tools/check_function_manifest.test.js
    - run: node --test ../tools/check_function_secrets.test.js
    - run: node --test ../tools/test_push_service_worker.js
    - run: node --test ../tools/test_web_bootstrap.js
    - name: Reject critical and high production vulnerabilities
      run: npm audit --omit=dev --audit-level=high
    - name: Verify web release provenance and deployment contracts
      run: node --test ../tools/web_release_contract.test.js ../tools/rehearse_web_backend.test.js ../tools/web_release_operations.test.js ../tools/seed_web_qualification.test.js ../tests/web_backend_tools.test.cjs
        ../tests/web_browser_pilot.test.cjs ../tests/web_browser_communications.test.cjs ../tests/web_safari_producer.test.cjs ../tests/browser/*.test.cjs
  firebase-emulators:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
        cache-dependency-path: functions/package-lock.json
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
    - run: npm ci
      working-directory: functions
    - name: Adversarial Firestore and Storage rules tests
      run: npm run test:rules
      working-directory: functions
    - name: Messaging transactions and security contracts
      run: npm run test:messaging
      working-directory: functions
    - name: Isolated Functions integration suites
      run: npm run test:integration
      working-directory: functions
    - name: Launch integrity and worker concurrency
      run: npm run test:launch
      working-directory: functions
    - name: Smart Arrival and provider-independent attendance integration
      run: npm run test:attendance
      working-directory: functions
  android-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
    - run: flutter pub get --enforce-lockfile
    - run: dart run tools/check_android_release_config.dart
    - name: Generate isolated CI release certificate
      run: keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/attendus-ci-release.jks" -storepass ci-release-password
        -keypass ci-release-password -alias attendus-ci-release -keyalg RSA -keysize 3072 -validity 2 -dname "CN=Attendus
        CI, OU=Engineering, O=Attendus, C=US"
    - name: Build signed universal release APK
      env:
        GOOGLE_MAPS_ANDROID_API_KEY: ci-placeholder-key
        ATTENDUS_ANDROID_STORE_FILE: ${{ runner.temp }}/attendus-ci-release.jks
        ATTENDUS_ANDROID_STORE_PASSWORD: ci-release-password
        ATTENDUS_ANDROID_KEY_ALIAS: attendus-ci-release
        ATTENDUS_ANDROID_KEY_PASSWORD: ci-release-password
      run: flutter build apk --release --target-platform android-arm,android-arm64 --android-project-arg=disable-abi-filtering=true
        --dart-define=ATTENDUS_RELEASE_ID=${{ github.sha }}
    - name: Build signed release app bundle
      env:
        GOOGLE_MAPS_ANDROID_API_KEY: ci-placeholder-key
        ATTENDUS_ANDROID_STORE_FILE: ${{ runner.temp }}/attendus-ci-release.jks
        ATTENDUS_ANDROID_STORE_PASSWORD: ci-release-password
        ATTENDUS_ANDROID_KEY_ALIAS: attendus-ci-release
        ATTENDUS_ANDROID_KEY_PASSWORD: ci-release-password
      run: flutter build appbundle --release --target-platform android-arm,android-arm64 --android-project-arg=disable-abi-filtering=true
        --dart-define=ATTENDUS_RELEASE_ID=${{ github.sha }}
    - name: Verify release signatures and supported ABIs
      shell: bash
      run: "set -euo pipefail\napksigner=\"$(find \"$ANDROID_SDK_ROOT/build-tools\" -name apksigner -type f | sort\
        \ -V | tail -1)\"\ntest -x \"$apksigner\"\nmapfile -t apks < <(find build/app/outputs/flutter-apk -name\
        \ 'app-release.apk' -type f | sort)\ntest \"${#apks[@]}\" -eq 1\nfor apk in \"${apks[@]}\"; do\n  mapfile\
        \ -t abis < <(unzip -Z -1 \"$apk\" | awk -F/ '$1 == \"lib\" && $3 != \"\" {print $2}' | sort -u)\n  test\
        \ \"${#abis[@]}\" -eq 2\n  test \"${abis[0]}\" = \"arm64-v8a\"\n  test \"${abis[1]}\" = \"armeabi-v7a\"\n\
        \  output=\"$($apksigner verify --print-certs \"$apk\")\"\n  grep -q 'CN=Attendus CI' <<<\"$output\"\n \
        \ if grep -q 'CN=Android Debug' <<<\"$output\"; then\n    echo \"Debug certificate detected in $apk\" >&2\n\
        \    exit 1\n  fi\ndone\njarsigner -verify -certs -verbose build/app/outputs/bundle/release/app-release.aab\
        \ |\n  grep -q 'jar verified'\n"
    - uses: actions/upload-artifact@v4
      with:
        name: attendus-android-release-${{ github.sha }}
        path: 'build/app/outputs/flutter-apk/app-release.apk

          build/app/outputs/bundle/release/app-release.aab

          '
        if-no-files-found: error
  ios-release:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
    - run: flutter pub get --enforce-lockfile
    - name: Configure non-secret CI Maps placeholder
      run: echo 'GOOGLE_MAPS_IOS_API_KEY=ci-placeholder-key' > ios/Flutter/Maps.xcconfig
    - name: Compile unsigned iOS release
      run: flutter build ios --release --no-codesign --dart-define=ATTENDUS_RELEASE_ID=${{ github.sha }}
    - name: Package compiled iOS release
      run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/attendus-ios-release.zip
    - uses: actions/upload-artifact@v4
      with:
        name: attendus-ios-release-${{ github.sha }}
        path: build/ios/attendus-ios-release.zip
        if-no-files-found: error
  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Scan full history with verified Gitleaks 8.30.1
      shell: bash
      run: |
        set -euo pipefail
        tool_dir="$RUNNER_TEMP/attendus-gitleaks-8.30.1"
        mkdir -p "$tool_dir"
        curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          --output "$tool_dir/gitleaks.tar.gz"
        printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$tool_dir/gitleaks.tar.gz" | sha256sum --check --strict
        tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
        "$tool_dir/gitleaks" version
        "$tool_dir/gitleaks" git --redact --config .gitleaks.toml --log-opts="--all" .
  admin-desktop-integration:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Check Admin packaging failure handling without building
      run: ./scripts/test_admin_build_guard.ps1
      shell: pwsh
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
    - run: flutter pub get --enforce-lockfile
      working-directory: apps/attendus_admin
    - name: Exercise the desktop Admin workflow with isolated fixtures
      run: flutter test integration_test/admin_workflow_test.dart -d windows
      working-directory: apps/attendus_admin
  quality-complete:
    needs:
    - flutter-quality
    - web-release
    - functions
    - firebase-emulators
    - android-release
    - ios-release
    - secret-scan
    - admin-desktop-integration
    - browser-journeys
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Require every quality job
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: "python3 - <<'PY'\nimport json, os\nresults = json.loads(os.environ['RESULTS'])\nfailed = [name for name,\
        \ result in results.items() if result['result'] != 'success']\nif failed:\n    raise SystemExit('Quality\
        \ gates did not pass: ' + ', '.join(failed))\nprint('All quality gates passed for this source revision.')\n\
        PY"
  browser-journeys:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.44.6
        cache: true
    - uses: browser-actions/setup-chrome@v2.2.0
      id: chrome
      with:
        install-chromedriver: true
        install-dependencies: true
    - run: npm ci
      working-directory: functions
    - run: npm ci
      working-directory: tests/browser
    - run: npx playwright install --with-deps chromium firefox webkit
      working-directory: tests/browser
    - name: Public registration across browser engines
      run: node functions/tools/run-integration-tests.js --project demo-attendus-admin --suite public-browser
    - run: flutter pub get --enforce-lockfile
    - name: Flutter form and real local Firebase journey
      env:
        CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        ATTENDUS_WEBDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
      run: node functions/tools/run-integration-tests.js --project demo-attendus-admin --suite flutter-browser
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: browser-journey-evidence
        path: 'tests/browser/test-results/

          build/debugging-flutter-integration/

          '
