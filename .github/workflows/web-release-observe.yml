name: Collect executable staging web evidence
'on':
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful immutable candidate workflow run ID
        required: true
      producer:
        type: choice
        options:
        - browser
        - backend
        - operations
        - safari
        required: true
      prior_evidence_runs:
        description: Optional comma-separated immutable prior collector run IDs for replay and observation comparison
        required: false
        default: ''
      gates:
        type: choice
        options:
        - all
        - observation
        - post-close-replay
        default: all
        required: true
      app_check_mode:
        description: Debug mode collects functional diagnostics only and can never qualify a release
        type: choice
        options:
        - real
        - staging-debug-functional
        default: real
        required: true
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  collect:
    runs-on: ${{ inputs.producer == 'safari' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 60
    environment: staging
    env:
      GH_TOKEN: ${{ github.token }}
      STAGING_WEB_QA_CONTEXT_JSON: ${{ secrets.STAGING_WEB_QA_CONTEXT_JSON }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      PRODUCER: ${{ inputs.producer }}
      PRIOR_EVIDENCE_RUNS: ${{ inputs.prior_evidence_runs }}
      GATES: ${{ inputs.gates }}
      APPCHECK_MODE: ${{ inputs.app_check_mode }}
    steps:
    - uses: actions/checkout@v4
    - name: Validate producer gate mode before installing or authenticating
      run: node -e "const e = require('./tools/web_release_evidence'); e.selectedGates(process.env.PRODUCER, process.env.GATES); e.collectionAppCheckMode(process.env.PRODUCER, process.env.GATES, process.env.APPCHECK_MODE)"
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: npm ci
      working-directory: functions
    - run: npm ci
      working-directory: tests/browser
    - run: npx playwright install --with-deps chromium firefox webkit chrome msedge
      if: ${{ inputs.producer == 'browser' }}
      working-directory: tests/browser
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.WIF_PROVIDER }}
        service_account: ${{ vars.EVIDENCE_SERVICE_ACCOUNT }}
    - run: 'args=()

        if [ -n "$PRIOR_EVIDENCE_RUNS" ]; then args+=(--prior-evidence-runs "$PRIOR_EVIDENCE_RUNS"); fi

        node tools/web_release_evidence.js --candidate-run "$CANDIDATE_RUN" --producer "$PRODUCER" --gates "$GATES"
        --output build/staging-evidence "${args[@]}"'
      name: Execute allowlisted producer against frozen staging
      if: ${{ inputs.app_check_mode == 'real' }}
    - name: Collect staging App Check functional diagnostics (never qualification)
      if: ${{ inputs.app_check_mode == 'staging-debug-functional' }}
      env:
        STAGING_APPCHECK_DEBUG_TOKEN: ${{ secrets.STAGING_APPCHECK_DEBUG_TOKEN }}
        STAGING_APPCHECK_DEBUG_RESOURCE: ${{ vars.STAGING_APPCHECK_DEBUG_RESOURCE }}
      run: |
        args=()
        if [ -n "$PRIOR_EVIDENCE_RUNS" ]; then args+=(--prior-evidence-runs "$PRIOR_EVIDENCE_RUNS"); fi
        node tools/web_release_evidence.js --candidate-run "$CANDIDATE_RUN" --producer "$PRODUCER" --gates "$GATES" --app-check-mode staging-debug-functional --output build/staging-evidence "${args[@]}"
    - uses: actions/upload-artifact@v4
      with:
        name: web-staging-evidence
        path: build/staging-evidence-publish/
        include-hidden-files: true
        retention-days: 90
        if-no-files-found: error
      if: always()
concurrency:
  group: attendus-web-staging-evidence
  cancel-in-progress: false
