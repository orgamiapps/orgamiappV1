name: Attendus Admin Windows
'on':
  pull_request:
    paths:
    - apps/attendus_admin/**
    - functions/admin/**
    - functions/test/**
    - firestore.rules
    - installer/**
    - scripts/build_admin_windows.ps1
    - .github/workflows/attendus-admin-windows.yml
  workflow_dispatch: null
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    secrets: inherit
  windows-installer:
    runs-on: windows-2022
    needs:
    - quality
    env:
      ATTENDUS_FIREBASE_API_KEY: ${{ secrets.ATTENDUS_FIREBASE_API_KEY }}
      ATTENDUS_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.ATTENDUS_GOOGLE_OAUTH_CLIENT_ID }}
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.44.6
        cache: true
    - run: choco install innosetup --no-progress -y
    - run: .\scripts\build_admin_windows.ps1 -Version 1.0.0
      shell: pwsh
    - uses: actions/upload-artifact@v4
      with:
        name: AttendusAdmin-windows-x64-installer
        path: dist/AttendusAdmin-*-windows-x64-setup.exe
        if-no-files-found: error
