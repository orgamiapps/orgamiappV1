name: Attendus Admin Windows
on:
  pull_request:
    paths: ['apps/attendus_admin/**', 'functions/admin/**', 'functions/test/**', 'firestore.rules', 'installer/**', 'scripts/build_admin_windows.ps1', '.github/workflows/attendus-admin-windows.yml']
  workflow_dispatch:

jobs:
  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npm run test:rules
        working-directory: functions
      - run: npm run test:integration
        working-directory: functions

  windows-installer:
    runs-on: windows-2022
    needs: backend-security
    env:
      ATTENDUS_FIREBASE_API_KEY: ${{ secrets.ATTENDUS_FIREBASE_API_KEY }}
      ATTENDUS_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.ATTENDUS_GOOGLE_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.6', cache: true}
      - run: choco install innosetup --no-progress -y
      - run: .\scripts\build_admin_windows.ps1 -Version 1.0.0
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: AttendusAdmin-windows-x64-installer
          path: dist/AttendusAdmin-*-windows-x64-setup.exe
          if-no-files-found: error
