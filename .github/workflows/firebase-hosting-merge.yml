name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  checks: write
  contents: read
  id-token: write
jobs:
  firestore_indexes:
    uses: ./.github/workflows/deploy-firestore-indexes.yml
    with:
      project_id: both

  functions:
    needs: firestore_indexes
    uses: ./.github/workflows/deploy-functions.yml

  build_and_deploy:
    needs: functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true
      
      # Get Flutter dependencies
      - name: Get dependencies
        run: flutter pub get

      - name: Validate map configuration
        env:
          GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.GOOGLE_MAPS_WEB_API_KEY }}
        run: dart run tools/check_maps_web_key.dart
      
      # Build Flutter web app
      - name: Build Flutter web
        run: >-
          flutter build web --release
          --pwa-strategy=none
          --no-wasm-dry-run
          --dart-define=GOOGLE_MAPS_WEB_API_KEY=${{ secrets.GOOGLE_MAPS_WEB_API_KEY }}
          --dart-define=ATTENDUS_RELEASE_ID=${{ github.sha }}

      - name: Retire legacy Flutter service worker
        run: cp web/flutter_service_worker_retirement.js build/web/flutter_service_worker.js

      - name: Retain supported web releases
        run: dart run tools/retain_web_releases.dart https://attendus.app/

      - name: Package immutable web release
        run: dart run tools/package_web_release.dart

      - name: Validate deferred and retained assets
        run: dart run tools/check_deferred_web_chunks.dart

      - name: Enforce initial bundle budget
        run: dart run tools/check_web_bundle_size.dart

      - uses: google-github-actions/auth@v3
        with:
          project_id: orgami-66nxok
          workload_identity_provider: projects/951311475019/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: sa-deployer@orgami-66nxok.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Firebase tooling
        run: npm ci --prefix functions

      - name: Reject source/deployment function drift
        run: node tools/check_function_manifest.js orgami-66nxok

      - name: Deploy Firebase Hosting
        run: >-
          ./functions/node_modules/.bin/firebase deploy --only hosting
          --project orgami-66nxok
          --non-interactive

      - name: Verify live release assets
        run: |
          dart run tools/check_deferred_web_chunks.dart https://attendus.app/
          dart run tools/check_deferred_web_chunks.dart https://orgami-66nxok.web.app/
