name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # Get Flutter dependencies
      - name: Get dependencies
        run: flutter pub get

      - name: Validate map configuration
        env:
          GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.GOOGLE_MAPS_WEB_API_KEY }}
        run: test -n "$GOOGLE_MAPS_WEB_API_KEY"
      
      # Build Flutter web app
      - name: Build Flutter web
        run: >-
          flutter build web --release
          --pwa-strategy=none
          --no-wasm-dry-run
          --dart-define=GOOGLE_MAPS_WEB_API_KEY=${{ secrets.GOOGLE_MAPS_WEB_API_KEY }}

      - name: Enforce initial bundle budget
        run: dart run tools/check_web_bundle_size.dart
      
      # Deploy to Firebase Hosting
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORGAMI_66NXOK }}
          channelId: live
          projectId: orgami-66nxok
