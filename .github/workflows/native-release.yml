name: Signed native internal release
'on':
  workflow_dispatch:
    inputs:
      build_number:
        description: Unique increasing store build number
        required: true
      target_environment:
        type: choice
        options:
        - staging
        - production
        default: staging
        required: true
      platform:
        type: choice
        options:
        - both
        - android
        - ios
        default: both
permissions:
  contents: read
concurrency:
  group: native-release
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    secrets: inherit
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    environment: native-release
    env:
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      ATTENDUS_ANDROID_STORE_PASSWORD: ${{ secrets[inputs.target_environment == 'staging' && 'ATTENDUS_ANDROID_STORE_PASSWORD_STAGING' || 'ATTENDUS_ANDROID_STORE_PASSWORD'] }}
      ATTENDUS_ANDROID_KEY_PASSWORD: ${{ secrets[inputs.target_environment == 'staging' && 'ATTENDUS_ANDROID_KEY_PASSWORD_STAGING' || 'ATTENDUS_ANDROID_KEY_PASSWORD'] }}
      ATTENDUS_ANDROID_KEY_ALIAS: ${{ secrets[inputs.target_environment == 'staging' && 'ATTENDUS_ANDROID_KEY_ALIAS_STAGING' || 'ATTENDUS_ANDROID_KEY_ALIAS'] }}
      ATTENDUS_ANDROID_STORE_FILE: ${{ github.workspace }}/android/upload-keystore.jks
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.44.6
        cache: true
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
    - name: Shared native release preflight
      env:
        RELEASE_CONFIG: ${{ secrets[inputs.target_environment == 'staging' && 'ATTENDUS_ANDROID_STAGING_CONFIG_JSON' || 'ATTENDUS_ANDROID_PRODUCTION_CONFIG_JSON'] }}
        FIREBASE_CONFIG: ${{ secrets[inputs.target_environment == 'staging' && 'ATTENDUS_ANDROID_STAGING_FIREBASE_BASE64' || 'ATTENDUS_ANDROID_PRODUCTION_FIREBASE_BASE64'] }}
      run: |
        python3 - <<'PY'
        import os, json, base64
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP'])
        config = json.loads(os.environ['RELEASE_CONFIG'])
        if config.get('environment') != '${{ inputs.target_environment }}':
            raise SystemExit('Selected environment does not match protected configuration')
        config['serviceConfigPath'] = 'firebase-service.config'
        (root / 'native-release.json').write_text(json.dumps(config))
        (root / 'firebase-service.config').write_bytes(base64.b64decode(os.environ['FIREBASE_CONFIG'], validate=True))
        PY
        python3 tools/native_release_preflight.py --config "$RUNNER_TEMP/native-release.json" --platform android --prepare
    - name: Load protected signing material
      env:
        KEYSTORE: ${{ secrets[inputs.target_environment == 'staging' && 'ATTENDUS_ANDROID_KEYSTORE_BASE64_STAGING' || 'ATTENDUS_ANDROID_KEYSTORE_BASE64'] }}
        PLAY_JSON: ${{ secrets[inputs.target_environment == 'staging' && 'ATTENDUS_PLAY_SERVICE_ACCOUNT_JSON_STAGING' || 'ATTENDUS_PLAY_SERVICE_ACCOUNT_JSON'] }}
      run: |
        set -euo pipefail
        [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
        test -n "$KEYSTORE" && test -n "$PLAY_JSON"
        test -n "$GOOGLE_MAPS_ANDROID_API_KEY"
        [[ "$GOOGLE_MAPS_ANDROID_API_KEY" =~ ^AIza[A-Za-z0-9_-]{35}$ ]]
        test -n "$ATTENDUS_ANDROID_KEY_ALIAS" && test -n "$ATTENDUS_ANDROID_STORE_PASSWORD" && test -n "$ATTENDUS_ANDROID_KEY_PASSWORD"
        printf '%s' "$KEYSTORE" | base64 --decode > "$ATTENDUS_ANDROID_STORE_FILE"
        printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
        chmod 600 "$ATTENDUS_ANDROID_STORE_FILE" "$RUNNER_TEMP/play.json"
    - name: Validate native preflight
      run: python3 -m unittest discover -s tools -p "test_native_release_preflight.py"
    - run: flutter pub get --enforce-lockfile
    - run: flutter analyze
    - run: flutter test
    - name: Build signed AAB
      run: flutter build appbundle --release --build-number="$BUILD_NUMBER" --dart-define-from-file=build/native-release/defines.json --dart-define=ATTENDUS_RELEASE_ID=${{ github.sha
        }}
    - name: Publish to Play internal testing
      run: |
        gem install fastlane --version 2.228.0 --no-document
        fastlane supply --aab build/app/outputs/bundle/release/app-release.aab --package_name "$ATTENDUS_APPLICATION_ID" --track internal --release_status completed --json_key "$RUNNER_TEMP/play.json" --skip_upload_metadata true --skip_upload_images true --skip_upload_screenshots true
        sha256sum build/app/outputs/bundle/release/app-release.aab > build/app/outputs/bundle/release/artifact.sha256
    - uses: actions/upload-artifact@v4
      with:
        name: play-${{ inputs.target_environment }}-${{ github.sha }}-${{ inputs.build_number }}
        path: |
          build/app/outputs/bundle/release/
          build/native-release/android-manifest.json
    - if: always()
      run: rm -f "$ATTENDUS_ANDROID_STORE_FILE" "$RUNNER_TEMP/play.json"
    needs:
    - quality
  ios:
    if: inputs.platform != 'android'
    runs-on: macos-latest
    environment: native-release
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
      TEAM_ID: ${{ vars.ATTENDUS_APPLE_TEAM_ID }}
      GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.44.6
        cache: true
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
    - name: Shared native release preflight
      env:
        RELEASE_CONFIG: ${{ secrets[inputs.target_environment == 'staging' && 'ATTENDUS_IOS_STAGING_CONFIG_JSON' || 'ATTENDUS_IOS_PRODUCTION_CONFIG_JSON'] }}
        FIREBASE_CONFIG: ${{ secrets[inputs.target_environment == 'staging' && 'ATTENDUS_IOS_STAGING_FIREBASE_BASE64' || 'ATTENDUS_IOS_PRODUCTION_FIREBASE_BASE64'] }}
      run: |
        python3 - <<'PY'
        import os, json, base64
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP'])
        config = json.loads(os.environ['RELEASE_CONFIG'])
        if config.get('environment') != '${{ inputs.target_environment }}':
            raise SystemExit('Selected environment does not match protected configuration')
        config['serviceConfigPath'] = 'firebase-service.config'
        (root / 'native-release.json').write_text(json.dumps(config))
        (root / 'firebase-service.config').write_bytes(base64.b64decode(os.environ['FIREBASE_CONFIG'], validate=True))
        PY
        python3 tools/native_release_preflight.py --config "$RUNNER_TEMP/native-release.json" --platform ios --prepare
    - name: Configure protected Apple signing
      env:
        CERTIFICATE: ${{ secrets[inputs.target_environment == 'staging' && 'ATTENDUS_IOS_CERTIFICATE_BASE64_STAGING' || 'ATTENDUS_IOS_CERTIFICATE_BASE64'] }}
        CERTIFICATE_PASSWORD: ${{ secrets[inputs.target_environment == 'staging' && 'ATTENDUS_IOS_CERTIFICATE_PASSWORD_STAGING' || 'ATTENDUS_IOS_CERTIFICATE_PASSWORD'] }}
        PROFILE: ${{ secrets[inputs.target_environment == 'staging' && 'ATTENDUS_IOS_PROFILE_BASE64_STAGING' || 'ATTENDUS_IOS_PROFILE_BASE64'] }}
        API_KEY: ${{ secrets[inputs.target_environment == 'staging' && 'ATTENDUS_APPSTORE_API_KEY_JSON_STAGING' || 'ATTENDUS_APPSTORE_API_KEY_JSON'] }}
        KEYCHAIN_PASSWORD: ${{ secrets.ATTENDUS_KEYCHAIN_PASSWORD }}
      run: python3 tools/prepare_ios_release.py
    - name: Validate native preflight
      run: python3 -m unittest discover -s tools -p "test_native_release_preflight.py"
    - run: flutter pub get --enforce-lockfile
    - run: flutter analyze
    - run: flutter test
    - name: Build distribution-signed IPA
      run: flutter build ipa --release --build-number="$BUILD_NUMBER" --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" --dart-define-from-file=build/native-release/defines.json
        --dart-define=ATTENDUS_RELEASE_ID=${{ github.sha }} --dart-define=ATTENDUS_ENABLE_APPLE_SIGN_IN=true
    - name: Upload TestFlight candidate
      run: |
        gem install fastlane --version 2.228.0 --no-document
        fastlane pilot upload --ipa "$(find build/ios/ipa -name '*.ipa' -print -quit)" --api_key_path "$RUNNER_TEMP/appstore-api.json" --skip_waiting_for_build_processing true
        shasum -a 256 build/ios/ipa/*.ipa > build/ios/ipa/artifact.sha256
    - uses: actions/upload-artifact@v4
      with:
        name: testflight-${{ inputs.target_environment }}-${{ github.sha }}-${{ inputs.build_number }}
        path: |
          build/ios/ipa/
          build/native-release/ios-manifest.json
    - if: always()
      run: |
        security delete-keychain "$RUNNER_TEMP/attendus-signing.keychain-db" || true
        rm -f "$RUNNER_TEMP/appstore-api.json" "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision"
    needs:
    - quality
