<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Attendus - Event attendance management app.">

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://maps.googleapis.com" crossorigin>
  <link rel="preload" href="main.dart.js" as="script">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Attendus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Attendus</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f7f9fc;
      color: #17324d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #attendus-loading {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f7fbff 0%, #eef6fc 100%);
      transition: opacity 160ms ease;
    }

    #attendus-loading.attendus-loading--leaving {
      opacity: 0;
      pointer-events: none;
    }

    .attendus-loading__content {
      width: min(84vw, 320px);
      text-align: center;
    }

    .attendus-loading__logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 14px 36px rgba(28, 96, 145, 0.18);
    }

    .attendus-loading__title {
      margin: 18px 0 6px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.6px;
    }

    .attendus-loading__status {
      min-height: 22px;
      margin: 0;
      color: #557086;
      font-size: 15px;
    }

    .attendus-loading__bar {
      height: 3px;
      margin: 22px auto 0;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(11, 126, 194, 0.14);
    }

    .attendus-loading__bar::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: #0b7ec2;
      animation: attendus-loading 1s ease-in-out infinite;
    }

    .attendus-loading__retry {
      display: none;
      margin: 20px auto 0;
      padding: 10px 18px;
      border: 0;
      border-radius: 999px;
      background: #0b7ec2;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    #attendus-loading.attendus-loading--error .attendus-loading__bar {
      display: none;
    }

    #attendus-loading.attendus-loading--error .attendus-loading__retry {
      display: block;
    }

    @keyframes attendus-loading {
      0% { transform: translateX(-110%); }
      50% { transform: translateX(65%); }
      100% { transform: translateX(225%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #attendus-loading { transition: none; }
      .attendus-loading__bar::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="attendus-loading" role="status" aria-live="polite">
    <div class="attendus-loading__content">
      <img
        class="attendus-loading__logo"
        src="icons/Icon-192.png"
        alt="Attendus"
        width="88"
        height="88"
      >
      <h1 class="attendus-loading__title">Attendus</h1>
      <p id="attendus-loading-status" class="attendus-loading__status">
        Getting things ready&hellip;
      </p>
      <div class="attendus-loading__bar" aria-hidden="true"></div>
      <button
        class="attendus-loading__retry"
        type="button"
        onclick="window.location.reload()"
      >
        Try again
      </button>
    </div>
  </div>
  <script>
    window.attendusBootStartedAt = performance.now();
    window.attendusShowStartupError = function (error) {
      console.error('Attendus startup failed:', error);
      const loading = document.getElementById('attendus-loading');
      const status = document.getElementById('attendus-loading-status');
      if (loading) loading.classList.add('attendus-loading--error');
      if (status) {
        status.textContent = 'We could not start Attendus. Check your connection and try again.';
      }
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js').catch(function (error) {
          console.warn('Firebase Messaging worker registration was skipped:', error);
        });
      });
    }

    // Complete legacy Flutter worker retirement before loading any release
    // code. A controlled page must navigate once after unregistering so the
    // next document is outside the old worker's cache-first lifecycle.
    (async function bootstrapAttendus() {
      const cleanupKey = 'attendus-legacy-flutter-cache-cleanup-v3';
      const reloadGuardKey = 'attendus-legacy-worker-reload-v3';
      const currentUrl = new URL(window.location.href);
      const returnTarget = currentUrl.searchParams.get('attendus_worker_return');
      if (returnTarget) {
        try {
          const targetUrl = new URL(returnTarget);
          const allowedOrigins = new Set([
            'https://attendus.app',
            'https://www.attendus.app',
            'https://orgami-66nxok.web.app',
            'https://orgami-66nxok.firebaseapp.com',
            `http://127.0.0.1:${window.location.port}`,
            `http://localhost:${window.location.port}`,
          ]);
          if (allowedOrigins.has(targetUrl.origin) &&
              targetUrl.origin !== window.location.origin) {
            window.location.replace(targetUrl.toString());
            return;
          }
        } catch (error) {
          console.warn('Invalid worker migration return URL:', error);
        }
        currentUrl.searchParams.delete('attendus_worker_return');
        window.history.replaceState(null, '', currentUrl.toString());
      }

      function migrationBridgeUrl(returnUrl) {
        let bridgeOrigin;
        switch (window.location.hostname) {
          case 'attendus.app':
          case 'www.attendus.app':
            bridgeOrigin = 'https://orgami-66nxok.web.app';
            break;
          case 'orgami-66nxok.web.app':
          case 'orgami-66nxok.firebaseapp.com':
            bridgeOrigin = 'https://attendus.app';
            break;
          case '127.0.0.1':
            bridgeOrigin = `http://localhost:${window.location.port}`;
            break;
          case 'localhost':
            bridgeOrigin = `http://127.0.0.1:${window.location.port}`;
            break;
          default:
            return null;
        }
        const bridgeUrl = new URL('/', bridgeOrigin);
        bridgeUrl.searchParams.set('attendus_worker_return', returnUrl);
        return bridgeUrl;
      }

      let needsCleanup = true;
      try {
        needsCleanup = window.localStorage.getItem(cleanupKey) !== 'done';
      } catch (_) {
        // Storage can be unavailable in private browsing. The cleanup remains
        // best-effort and is still capped below.
      }

      async function cleanupLegacyFlutterCache() {
        let controlledByFlutterWorker = false;
        try {
          if ('serviceWorker' in navigator) {
            controlledByFlutterWorker = Boolean(
              navigator.serviceWorker.controller?.scriptURL.includes(
                'flutter_service_worker.js',
              ),
            );
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(
              registrations
                .filter((registration) => {
                  const worker = registration.active ||
                      registration.waiting ||
                      registration.installing;
                  return worker?.scriptURL.includes('flutter_service_worker.js');
                })
                .map((registration) => registration.unregister()),
            );
          }

          if (needsCleanup && 'caches' in window) {
            const cacheNames = await caches.keys();
            await Promise.all(
              cacheNames
                .filter((cacheName) => cacheName.startsWith('flutter-'))
                .map((cacheName) => caches.delete(cacheName)),
            );
          }
        } catch (error) {
          console.warn('Legacy Flutter cache cleanup was skipped:', error);
        } finally {
          try {
            window.localStorage.setItem(cleanupKey, 'done');
          } catch (_) {
            // Persistent storage is optional; startup must still continue.
          }
        }
        return controlledByFlutterWorker;
      }

      try {
        const controlledByFlutterWorker = await cleanupLegacyFlutterCache();
        if (controlledByFlutterWorker) {
          let alreadyReloaded = false;
          try {
            alreadyReloaded = window.sessionStorage.getItem(reloadGuardKey) === 'done';
          } catch (_) {
            // Private browsing may not expose sessionStorage.
          }
          if (!alreadyReloaded) {
            try {
              window.sessionStorage.setItem(reloadGuardKey, 'done');
            } catch (_) {
              // A URL marker below still prevents an automatic reload loop.
            }
            const migrationUrl = new URL(window.location.href);
            if (!migrationUrl.searchParams.has('attendus_worker_migrated')) {
              migrationUrl.searchParams.set('attendus_worker_migrated', '1');
              const bridgeUrl = migrationBridgeUrl(migrationUrl.toString());
              if (bridgeUrl) {
                window.location.replace(bridgeUrl.toString());
                return;
              }
            }
          }
          window.attendusShowStartupError(
            new Error('Legacy Flutter worker still controls this page.'),
          );
          return;
        }
      } catch (error) {
        console.warn('Legacy Flutter worker migration was skipped:', error);
      }

      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      bootstrap.async = true;
      bootstrap.onerror = window.attendusShowStartupError;
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
